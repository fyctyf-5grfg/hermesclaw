name: Hermes GitHub Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: hermes-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  hermes:
    if: >-
      (github.event_name == 'issues' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' && github.event.comment.user.login != 'github-actions[bot]' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Link Hermes home into repository
        run: |
          rm -rf "$HOME/.hermes"
          ln -s "${{ github.workspace }}/.hermes" "$HOME/.hermes"

      - name: Install Hermes Agent
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-browser --skip-setup --non-interactive --skip-computer-use

      - name: Run Hermes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          HERMES_HOME: ${{ github.workspace }}/.hermes
          OPENAI_API_KEY: cloudflare-local
          OPENAI_BASE_URL: http://127.0.0.1:8788/v1
          HERMES_MODEL: ${{ vars.HERMES_MODEL || '@cf/zai-org/glm-4.7-flash' }}
          HERMES_COMMAND: hermes -m "${{ vars.HERMES_MODEL || '@cf/zai-org/glm-4.7-flash' }}" --no-restore-cwd --in "${{ github.workspace }}"
          HERMES_PROMPT_FLAG: --oneshot
        run: |
          cd "${{ github.workspace }}"
          export PATH="$HOME/.hermes/bin:$PATH"
          scripts/change-model
          curl -fsS http://127.0.0.1:8788/health >/dev/null || {
            cat /tmp/cf-proxy.py.log >&2 || true
            exit 1
          }
          trap 'pkill -f "cf-proxy.py" 2>/dev/null || true' EXIT
          python3 hermes_github_bot.py

      - name: Commit Hermes home and agent changes
        run: |
          git config user.name "hermes-agent[bot]"
          git config user.email "hermes-agent[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update Hermes agent state"
          git push