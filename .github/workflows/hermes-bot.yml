name: Hermes GitHub Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: hermes-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  hermes:
    if: >-
      (github.event_name == 'issues' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' && github.event.comment.user.login != 'github-actions[bot]' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Hermes Agent
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-browser --skip-setup --non-interactive --skip-computer-use

      - name: Run Hermes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          HERMES_HOME: ${{ github.workspace }}/.hermes
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          HERMES_MODEL: ${{ vars.HERMES_MODEL || 'gpt-4o-mini' }}
        run: |
          export PATH="$HOME/.hermes/bin:$PATH"
          hermes model set "$HERMES_MODEL" || true
          python3 hermes_github_bot.py

      - name: Commit Hermes home and agent changes
        run: |
          git config user.name "hermes-agent[bot]"
          git config user.email "hermes-agent[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update Hermes agent state"
          git push