name: Hermes WebUI Tunnel

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hermes-webui
  cancel-in-progress: false

jobs:
  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN }}
          

      - name: Prepare repository-backed Hermes home
        run: |
          chmod -R u+rwX "${{ github.workspace }}"
          git config --global --add safe.directory "${{ github.workspace }}"
          rm -rf "$HOME/.hermes"
          ln -s "${{ github.workspace }}/.hermes" "$HOME/.hermes"
          rm -rf "${{ github.workspace }}/.hermes/hermes-agent"

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- \
             --non-interactive

      - name: Configure Cloudflare model proxy
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
          scripts/change-model
          bash scripts/ttyd

      - name: Install Hermes WebUI in background
        run: |
          nohup bash -c 'curl -fsSL https://get-hermes.ai/install.sh | bash' \
            > /tmp/hermes-webui-install.log 2>&1 &
          echo "$!" > /tmp/hermes-webui-install.pid

      - name: Start Cloudflare tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate \
            --url http://127.0.0.1:8787 > /tmp/cloudflared.log 2>&1 &
          nohup "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate \
            --url http://127.0.0.1:38631 > /tmp/ttyd.log 2>&1 &


      - name: Publish WebUI URL indefinitely
        run: |
          git config user.name "hermes-agent[bot]"
          git config user.email "hermes-agent[bot]@users.noreply.github.com"
          (
            while true; do
              git add -A -- . ':(exclude).hermes/hermes-agent/**'
              if git diff --cached --quiet; then
                git pull --rebase origin main
                continue
              fi
              git commit -m "chore: update Hermes WebUI state"
              git pull --rebase origin main
              git push
              sleep 60
            done
          ) >/tmp/hermes-git-sync.log 2>&1 &
          while true; do          
          url=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | tail -1 || true)         
          url1=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/ttyd.log | tail -1 || true)      
          printf "${url}" > webui-url.txt    
          echo "Hermes WebUI: $url" 
          echo "Shell: $url1"
          sleep 20
          done
