name: Hermes Runtime

on:
  workflow_dispatch:

concurrency:
  group: hermes-runtime
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start cf-proxy in background
        run: |
          nohup python3 scripts/cf-proxy.py > /tmp/cf-proxy.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8788/health > /dev/null

      - name: Start run-mcp in background
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet fastmcp
          nohup scripts/run-mcp > /tmp/run-mcp.log 2>&1 &
          sleep 5
          tail -5 /tmp/run-mcp.log || true

      - name: Publish tunnel URLs to KV (keeps job alive until timeout)
        run: |
          chmod +x scripts/kv
          ./scripts/kv 8000 8788
